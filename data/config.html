<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Configuration</title>
    <link rel="icon" type="image/svg+xml" href="config.svg" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #4e73df, #1cc88a);
        min-height: 100vh;
      }

      /* Main Glass Container */
      .container {
        max-width: 750px;
        margin: auto;
        padding: 25px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        color: #fff;
      }

      /* Main Title */
      h1 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* Section Card */
      .section {
        background: rgba(255, 255, 255, 0.15);
        padding: 20px;
        margin-bottom: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        transition: transform 0.2s ease;
      }

      .section:hover {
        transform: translateY(-2px);
      }

      /* Section Heading */
      .section h2 {
        margin-top: 0;
        font-size: 18px;
        padding-left: 12px;
        border-left: 5px solid #5d009c;
        border-bottom: none;
        color: #5d009c;
        font-weight: 600;
      }

      /* Labels */
      label {
        display: block;
        margin-top: 15px;
        font-weight: 500;
        color: #032727;
      }

      /* Inputs */
      input,
      select {
        width: 100%;
        padding: 9px;
        margin-top: 6px;
        border-radius: 6px;
        border: none;
        outline: none;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.9);
        color: #333;
      }

      /* LUX Grid */
      .lux-grid {
        display: flex;
        gap: 40px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      .lux-box {
        flex: 1 1 45%;
      }

      /* Real Time LUX Display */
      .lux-display {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.2);
        text-align: center;
      }

      .lux-display h3 {
        margin: 0;
        color: #032727;
      }

      #luxValue {
        font-size: 30px;
        font-weight: bold;
        margin-top: 10px;
        color: #001bff;
      }

      /* Button */
      button {
        margin-top: 30px;
        padding: 12px;
        width: 100%;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(90deg, #ff8c00, #ff2e63);
        color: white;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.03);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      .hidden {
        display: none;
      }
      input:focus,
      select:focus {
        box-shadow: 0 0 0 2px #5d009c55;
        transform: scale(1.01);
        transition: 0.2s;
      }

      .section {
        animation: fadeIn 0.5s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .footer {
        text-align: center;
        margin-top: 100px;
        padding: 15px 10px;
        font-size: 13px;
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <form action="/save" method="POST">
        <h1>Device Configuration</h1>

        <!-- Temperature -->
        <div class="section">
          <h2>Temperature Settings</h2>

          <!-- <label>Temperature Unit</label>
          <select>
            <option>Celsius (°C)</option>
            <option>Fahrenheit (°F)</option>
            <option>Kelvin (K)</option>
          </select> -->

          <label>Temperature Precision</label>
          <select>
            <option>None</option>
            <option>Up to 1 Decimal</option>
            <option>Up to 2 Decimals</option>
          </select>

          <label>Humidity Precision</label>
          <select>
            <option>None</option>
            <option>Up to 1 Decimal</option>
            <option>Up to 2 Decimals</option>
          </select>
        </div>

        <!-- NTC -->
        <div class="section">
          <h2>NTC Settings</h2>

          <label>NTC Resistance at 25°C (Ohm)</label>
          <input type="number" placeholder="Example: 1000" />

          <label>NTC Beta Constant</label>
          <input type="number" value="3950" />

          <label>NTC Offset (°C)</label>
          <input type="number" step="0.1" value="0" />
        </div>

        <!-- LUX -->
        <div class="section">
          <h2>LUX Settings</h2>

          <label>LUX Percentage Mode</label>
          <select id="luxMode" onchange="toggleLuxMode()">
            <option value="auto" selected>Auto</option>
            <option value="manual">Manual</option>
          </select>

          <div class="lux-display">
            <h3>Real-Time Value</h3>
            <div id="luxValue">0 LUX</div>
          </div>

          <div id="manualLuxSection" class="hidden">
            <div class="lux-grid">
              <div class="lux-box">
                <label>Max LUX Value</label>
                <input type="number" />
              </div>
              <div class="lux-box">
                <label>Max Percentage (%)</label>
                <input type="number" />
              </div>
            </div>

            <div class="lux-grid">
              <div class="lux-box">
                <label>Min LUX Value</label>
                <input type="number" />
              </div>
              <div class="lux-box">
                <label>Min Percentage (%)</label>
                <input type="number" />
              </div>
            </div>
          </div>
        </div>

        <!-- Node-RED -->
        <div class="section">
          <h2>Node-RED Settings</h2>

          <label>Set IP Address</label>
          <input type="text" placeholder="192.168.1.100" />

          <label>Set Port</label>
          <input type="number" placeholder="1880" />

          <label>Send Interval (seconds)</label>
          <input type="number" placeholder="10" />
        </div>

        <!-- Time -->
        <div class="section">
          <h2>Time Settings</h2>

          <label>GMT Offset</label>
          <input type="number" step="0.5" placeholder="Example: 5.5" />

          <label>Clock Format</label>
          <select>
            <option>24 Hour</option>
            <option>12 Hour</option>
          </select>
        </div>

        <button>Save Configuration</button>
      </form>
    </div>

    <div class="footer">
      <div>ESP32 Web Configuration Dashboard | Developer © M.Maity</div>
    </div>

    <script>
      function toggleLuxMode() {
        var mode = document.getElementById("luxMode").value;
        var section = document.getElementById("manualLuxSection");
        section.classList.toggle("hidden", mode !== "manual");
      }

      setInterval(function () {
        let randomLux = Math.floor(Math.random() * 1000);
        document.getElementById("luxValue").innerText = randomLux + " LUX";
      }, 2000);
    </script>
  </body>
</html>
